[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Open punten [JORDY: ...] alleen tonen op deploy previews en branch-deploys, nooit in productie
[context.deploy-preview.environment]
  NEXT_PUBLIC_TOON_JORDY = "true"

[context.branch-deploy.environment]
  NEXT_PUBLIC_TOON_JORDY = "true"

# Alle hostvarianten in één 301 naar https://schildersbedrijf040.nl (geen keten via https://www)
[[redirects]]
  from = "http://www.schildersbedrijf040.nl/*"
  to = "https://schildersbedrijf040.nl/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.schildersbedrijf040.nl/*"
  to = "https://schildersbedrijf040.nl/:splat"
  status = 301
  force = true

